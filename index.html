<style>
/* Concept : application mobile en colonne unique, onglets flottants en bas, registre sobre blanc et bleu souverain. */
:root{
  --bg:#FFFFFF; --fg:#0E1420; --muted:#5A6578; --accent:#0B3D91; --on-accent:#FFFFFF;
  --surface:#F2F5FB; --line:#D8E0EE; --good:#17724A; --good-bg:#E3F4EB; --warn:#9A5B00; --warn-bg:#FFF1D6;
  color-scheme:light; --font-display:'Sora','Segoe UI',system-ui,sans-serif; --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.shell{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.logo{display:block;height:40px;width:auto;background:#fff;border-radius:8px;padding:0}
.brand{background:none;border:0;padding:0;display:block;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px;min-width:0}
h1{font-family:var(--font-display);font-size:26px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--font-display);font-size:17px;margin:0;letter-spacing:-.01em}
h3{font-size:15px;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=tel],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);min-height:46px}
textarea{resize:vertical;min-height:84px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)} .btn.block{width:100%}
.btn.small{min-height:38px;padding:0 14px;font-size:14px}
.back{align-self:flex-start;background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;min-height:40px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--line);min-height:52px}
.row .n{font-weight:600} .row .c{color:var(--muted);font-size:14px;white-space:nowrap}
.row:hover .n{color:var(--accent)}
.card{border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg);text-align:left;width:100%;min-width:0}
button.card:hover{border-color:var(--accent)}
.card.spons{border-color:var(--accent);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.split{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.seg button[aria-selected=true]{background:var(--bg);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:6}
.tabs nav{pointer-events:auto;width:100%;max-width:460px;display:flex;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:4px;box-shadow:0 8px 24px rgba(11,29,64,.14)}
.tabs button{flex:1;min-height:48px;border:0;border-radius:12px;background:transparent;font-weight:700;color:var(--muted)}
.tabs button[aria-current=page]{background:var(--accent);color:var(--on-accent)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;min-width:0;min-height:44px}
.checks input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:84px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:4px;opacity:.85}
.bars div:last-child{opacity:1}
.days{display:flex;gap:6px;font-size:11px;color:var(--muted)} .days span{flex:1;text-align:center}
.bill{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.bill td{padding:8px 0;border-bottom:1px solid var(--line)} .bill td:last-child{text-align:right;font-weight:600}
.bill tr.total td{border-bottom:0;font-weight:700;font-size:17px;color:var(--accent)}
.note{font-size:13px;padding:10px 12px;background:var(--warn-bg);color:var(--warn);border-radius:10px}
.rank{display:flex;flex-direction:column;gap:4px}
.rank div{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;font-size:14px;background:var(--surface)}
.rank div.me{background:var(--accent);color:var(--on-accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.err{color:#B3261E;font-size:13px}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}html,body{margin:0}body{font-size:16px}img{max-width:100%}[hidden]{display:none!important}</style>

function header(){
  var right='';
  if(S.tab==='trouver')right='<span class="pill">'+esc(R[S.region])+'</span>';
  else{var m=me();right='<span class="pill '+(m.active?'good':'warn')+'"><i></i>'+(m.active?'Actif':'Inactif')+'</span>'}
  return '<header class="top"><button class="brand" data-act="home" aria-label="KliQ, retour à l\'accueil">'+logo()+'</button>'+right+'</header>';
}
function tabs(){
  return '<div class="tabs"><nav aria-label="Navigation"><button data-act="tab" data-v="trouver" '+(S.tab==='trouver'?'aria-current="page"':'')+'>Trouver</button><button data-act="tab" data-v="entreprise" '+(S.tab==='entreprise'?'aria-current="page"':'')+'>Mon entreprise</button></nav></div>';
}

/* ---------- Côté citoyen ---------- */
function svcRows(){
  var norm=function(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')};var q=norm(S.q.trim()),keys=Object.keys(SV).filter(function(k){return !q||norm(SV[k]).indexOf(q)>-1});
  if(!keys.length)return '<p class="muted" style="padding:16px 0">Aucun service ne correspond à « '+esc(S.q)+' ».</p>';
  return '<div class="list">'+keys.map(function(k){var n=count(k,S.region);
    return '<button class="row" data-act="svc" data-v="'+k+'"><span class="n">'+SV[k]+'</span><span class="c">'+(n?n+(n>1?' entreprises':' entreprise'):'Aucune')+' ›</span></button>'}).join('')+'</div>';
}
function vHome(){
  var opts=Object.keys(R).map(function(k){return '<option value="'+k+'"'+(k===S.region?' selected':'')+'>'+R[k]+'</option>'}).join('');
  return '<main><div><h1>Trouvez un fournisseur près de chez vous.</h1><p class="muted" style="margin-top:8px">Gratuit, sans compte. Choisissez votre secteur, un service, puis l\'entreprise qui vous convient.</p></div>'+
  '<div class="field"><label class="label" for="region">Votre secteur</label><select id="region">'+opts+'</select></div>'+
  '<div class="field"><label class="label" for="q">Quel service cherchez-vous ?</label><input id="q" type="search" placeholder="Ex. déneigement, toiture, plombier" value="'+esc(S.q)+'" autocomplete="off"></div>'+
  '<div id="svcs">'+svcRows()+'</div>'+
  '<p class="muted small">Entreprises fictives de démonstration. Les vraies fiches arriveront avec le pilote en Abitibi.</p></main>';
}
function card(c,i){
  var sp=c.bid>0&&i<ranked(S.svc,S.region).filter(function(x){return x.bid>0}).length;
  if(c.id===S.me&&S.view==='list'){st(c.id).app[6]++}
  return '<button class="card'+(sp?' spons':'')+'" data-act="open" data-v="'+c.id+'"><div class="split"><h3>'+esc(c.name)+'</h3>'+(sp?'<span class="pill" style="background:var(--accent);color:var(--on-accent)">En vedette</span>':'')+'</div><p class="muted small">'+esc(c.tag)+'</p><p class="small">Depuis '+c.since+' · '+(2026-c.since)+' ans dans la région</p></button>';
}
function vList(){
  var l=ranked(S.svc,S.region),h='<main><button class="back" data-act="back">‹ Services</button><div><div class="label">'+esc(R[S.region])+'</div><h1>'+SV[S.svc]+'</h1><p class="muted" style="margin-top:6px">'+l.length+(l.length>1?' entreprises actives':' entreprise active')+'. Les profils en vedette sont indiqués.</p></div>';
  if(!l.length)h+='<div class="card"><h3>Aucune entreprise active pour l\'instant</h3><p class="muted small">Vous offrez ce service dans ce secteur ? Soyez la première entreprise inscrite.</p><button class="btn" data-act="tab" data-v="entreprise" data-b="join">Inscrire mon entreprise</button></div>';
  else h+='<div style="display:flex;flex-direction:column;gap:10px">'+l.map(card).join('')+'</div>';
  return h+'</main>';
}
function vProfile(){
  var c=co(S.cid),sp=c.bid>0;
  return '<main><button class="back" data-act="back">‹ '+SV[S.svc||c.svs[0]]+'</button><div><div class="split"><h1>'+esc(c.name)+'</h1></div><div class="chips" style="margin-top:10px"><span class="pill good"><i></i>Active</span>'+(sp?'<span class="pill">En vedette</span>':'')+'</div></div>'+
  '<div class="field"><span class="label">À propos</span><p>'+esc(c.tag)+' '+esc(c.hist||'Notre équipe sert la région avec des soumissions claires et un travail garanti.')+'</p></div>'+
  '<div class="field"><span class="label">Historique</span><p>Fondée en '+c.since+'. '+(2026-c.since)+' ans d\'expérience en Abitibi.</p></div>'+
  '<div class="field"><span class="label">Services offerts</span><div class="chips">'+c.svs.map(function(s){return '<span class="chip">'+SV[s]+'</span>'}).join('')+'</div></div>'+
  '<div class="field"><span class="label">Secteurs desservis</span><div class="chips">'+c.regs.map(function(r){return '<span class="chip">'+R[r]+'</span>'}).join('')+'</div></div>'+
  (S.phone?'<div class="card"><span class="label">Coordonnées (fictives)</span><div class="field"><span class="small muted">Téléphone</span><p style="font-size:22px;font-weight:700;font-family:var(--font-display)">'+esc(c.tel)+'</p><button class="btn ghost small" data-act="copy" data-v="'+esc(c.tel)+'">Copier le numéro</button></div><div class="field"><span class="small muted">Site web</span><p style="font-weight:600;word-break:break-all">'+esc(c.web||'Non indiqué')+'</p>'+(c.web?'<a class="btn ghost small" href="'+esc(/^https?:\/\//.test(c.web)?c.web:'https://'+c.web)+'" target="_blank" rel="noopener noreferrer">Visiter le site</a>':'')+'</div></div>':'<button class="btn block" data-act="phone">Voir les informations</button>')+'</main>';
}

/* ---------- Côté entreprise ---------- */
function bizTabs(){return '<div class="seg" role="tablist"><button role="tab" data-act="biz" data-v="dash" aria-selected="'+(S.bizTab==='dash')+'">Tableau de bord</button><button role="tab" data-act="biz" data-v="join" aria-selected="'+(S.bizTab==='join')+'">Inscription</button></div>'}
function vDash(){
  var m=me(),s=st(m.id),bs=S.boostSvc&&m.svs.indexOf(S.boostSvc)>-1?S.boostSvc:m.svs[0],br=S.boostReg&&m.regs.indexOf(S.boostReg)>-1?S.boostReg:m.regs[0];
  var l=ranked(bs,br),pos=l.indexOf(m)+1,mx=Math.max.apply(null,s.app.concat([1])),n=m.svs.length;
  var days=['L','M','M','J','V','S','D'];
  var rk=l.slice(0,6).map(function(c,i){return '<div class="'+(c===m?'me':'')+'"><span>'+(i+1)+'. '+esc(c.name)+'</span><span>'+(c.bid?money(c.bid):'—')+'</span></div>'}).join('');
  return '<main>'+bizTabs()+'<div><div class="label">Tableau de bord</div><h1>'+esc(m.name)+'</h1></div>'+
  (m.active?'':'<div class="note">Votre compte est inactif : vous n\'apparaissez plus dans les listes. Réactivez-le sans frais d\'inscription.</div>')+
  '<section class="field" style="gap:10px"><h2>Visibilité des 7 derniers jours</h2><div class="stats"><div class="stat"><b>'+s.app.reduce(function(a,b){return a+b},0)+'</b><span>apparitions en liste</span></div><div class="stat"><b>'+(s.vues[0]+s.vues[1]+Math.round(s.app.reduce(function(a,b){return a+b},0)*0.31))+'</b><span>vues du profil</span></div><div class="stat"><b>'+(s.contacts+9)+'</b><span>numéros affichés</span></div></div>'+
  '<div class="bars" aria-hidden="true">'+s.app.map(function(v){return '<div style="height:'+Math.round(v/mx*100)+'%"></div>'}).join('')+'</div><div class="days" aria-hidden="true">'+days.map(function(d){return '<span>'+d+'</span>'}).join('')+'</div>'+
  '<p class="muted small">Chiffres d\'exemple, mis à jour par vos clics dans ce prototype. Le rapport réel remplacera ces données.</p></section>'+
  '<section class="field" style="gap:10px"><h2>Boost de liste</h2><p class="muted small">Le plus offrant passe en premier dans son service et son secteur.</p>'+
  '<div class="checks"><div class="field"><label class="label" for="bsvc">Service</label><select id="bsvc">'+m.svs.map(function(k){return '<option value="'+k+'"'+(k===bs?' selected':'')+'>'+SV[k]+'</option>'}).join('')+'</select></div><div class="field"><label class="label" for="breg">Secteur</label><select id="breg">'+m.regs.map(function(k){return '<option value="'+k+'"'+(k===br?' selected':'')+'>'+R[k]+'</option>'}).join('')+'</select></div></div>'+
  '<p>Votre position : <b>'+pos+' sur '+l.length+'</b></p><div class="rank">'+rk+'</div>'+
  '<div class="field"><label class="label" for="bid">Votre enchère mensuelle ($)</label><input id="bid" type="number" min="0" step="5" value="'+m.bid+'" inputmode="numeric"></div><button class="btn" data-act="bid">Appliquer l\'enchère</button></section>'+
  '<section class="field" style="gap:10px"><h2>Abonnement</h2><table class="bill"><tr><td>Abonnement de base (1 service)</td><td>'+money(PRICE.mensuel)+'</td></tr><tr><td>Services additionnels ('+Math.max(0,n-1)+' × '+money(PRICE.service)+')</td><td>'+money(PRICE.service*Math.max(0,n-1))+'</td></tr><tr><td>Boost</td><td>'+money(m.bid)+'</td></tr><tr class="total"><td>Total mensuel</td><td>'+money(monthly(n)+m.bid)+'</td></tr></table>'+
  '<button class="btn ghost" data-act="active">'+(m.active?'Suspendre mon abonnement':'Réactiver sans frais d\'inscription')+'</button></section></main>';
}
function cost(){
  var n=document.querySelectorAll('#svcs-j input:checked').length,t=PRICE.inscription;
  return '<table class="bill"><tr><td>Frais d\'inscription (une fois)</td><td>'+money(PRICE.inscription)+'</td></tr><tr><td>Abonnement mensuel</td><td>'+money(PRICE.mensuel)+'</td></tr><tr><td>Services additionnels ('+Math.max(0,n-1)+')</td><td>'+money(PRICE.service*Math.max(0,n-1))+'</td></tr><tr class="total"><td>Mensualité</td><td>'+money(n?monthly(n):PRICE.mensuel)+'</td></tr></table>';
}
function vJoin(){
  if(S.done){var m=me();return '<main>'+bizTabs()+'<div class="card"><span class="pill good"><i></i>Inscription simulée</span><h1>'+esc(m.name)+' est inscrite.</h1><p class="muted">Aucun paiement réel n\'a été fait. Votre fiche apparaît maintenant dans les listes de ses services et secteurs.</p><button class="btn" data-act="gotodash">Ouvrir mon tableau de bord</button><button class="btn ghost" data-act="again">Inscrire une autre entreprise</button></div></main>'}
  var e=S.errors||{};
  return '<main>'+bizTabs()+'<div><div class="label">Inscription</div><h1>Faites-vous trouver en Abitibi.</h1><p class="muted" style="margin-top:8px">'+money(PRICE.inscription)+' à l\'inscription, puis '+money(PRICE.mensuel)+' par mois. Chaque service additionnel coûte '+money(PRICE.service)+' par mois. Vous pouvez arrêter vos paiements quand vous voulez.</p></div>'+
  '<form id="join" class="field" style="gap:18px" novalidate>'+
  '<div class="field"><label class="label" for="j-nom">Nom de l\'entreprise</label><input id="j-nom" type="text" autocomplete="organization">'+(e.nom?'<span class="err">'+e.nom+'</span>':'')+'</div>'+
  '<div class="field"><label class="label" for="j-desc">Description et historique</label><textarea id="j-desc" placeholder="Comment travaillez-vous ? Depuis quand ?"></textarea></div>'+
  '<div class="field"><label class="label" for="j-since">Année de fondation</label><input id="j-since" type="number" min="1950" max="2026" value="2020" inputmode="numeric"></div>'+
  '<div class="field"><label class="label" for="j-tel">Téléphone</label><input id="j-tel" type="tel" placeholder="819-555-0100" autocomplete="tel"></div>'+
  '<div class="field"><label class="label" for="j-web">Site web (facultatif)</label><input id="j-web" type="text" placeholder="www.monentreprise.ca" autocapitalize="none" autocomplete="url"></div>'+
  '<div class="field"><span class="label">Secteurs desservis</span><div class="checks" id="regs-j">'+Object.keys(R).map(function(k){return '<label><input type="checkbox" value="'+k+'">'+R[k]+'</label>'}).join('')+'</div>'+(e.reg?'<span class="err">'+e.reg+'</span>':'')+'</div>'+
  '<div class="field"><span class="label">Services offerts</span><div class="checks" id="svcs-j">'+Object.keys(SV).map(function(k){return '<label><input type="checkbox" value="'+k+'">'+SV[k]+'</label>'}).join('')+'</div>'+(e.svc?'<span class="err">'+e.svc+'</span>':'')+'</div>'+
  '<div class="field"><span class="label">Votre abonnement</span><div id="cost">'+cost()+'</div></div>'+
  '<button class="btn block" type="submit">S\'inscrire (simulation)</button></form></main>';
}

function render(){
  var body=S.tab==='trouver'?(S.view==='home'?vHome():S.view==='list'?vList():vProfile()):(S.bizTab==='dash'?vDash():vJoin());
  var y=window.scrollY;
  $('#app').innerHTML=header()+body+tabs();
  if(S.view==='home'&&S.tab==='trouver'){window.scrollTo(0,y)}
}
function go(){window.scrollTo(0,0);render()}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,v=b.dataset.v;
  if(a==='home'){S.tab='trouver';S.view='home';S.svc=null;S.cid=null;S.phone=false;S.q='';S.errors=null;try{history.replaceState(null,'','#trouver')}catch(e){}go()}
  else if(a==='tab'){S.tab=v;if(b.dataset.b)S.bizTab=b.dataset.b;S.errors=null;try{history.replaceState(null,'','#'+v)}catch(e){}go()}
  else if(a==='svc'){S.svc=v;S.view='list';go()}
  else if(a==='back'){if(S.view==='profile'&&S.svc){S.view='list'}else{S.view='home';S.svc=null}S.phone=false;go()}
  else if(a==='open'){S.cid=v;S.view='profile';S.phone=false;if(v===S.me)st(v).vues[1]++;go()}
  else if(a==='phone'){S.phone=true;if(S.cid===S.me)st(S.me).contacts++;render()}
  else if(a==='copy'){try{navigator.clipboard.writeText(v).then(function(){toast('Copié')},function(){toast('Copie impossible, sélectionnez le numéro')})}catch(e){toast('Copie impossible, sélectionnez le numéro')}}
  else if(a==='biz'){S.bizTab=v;S.done=false;S.errors=null;go()}
  else if(a==='bid'){var n=Math.max(0,Math.round(parseFloat($('#bid').value)||0));me().bid=n;S.boostSvc=$('#bsvc').value;S.boostReg=$('#breg').value;toast('Enchère appliquée : '+money(n)+' par mois');render()}
  else if(a==='active'){var m=me();m.active=!m.active;toast(m.active?'Compte réactivé, sans frais d\'inscription':'Abonnement suspendu : compte inactif');render()}
  else if(a==='gotodash'){S.bizTab='dash';S.done=false;go()}
  else if(a==='again'){S.done=false;go()}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){S.q=ev.target.value;$('#svcs').innerHTML=svcRows()}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='region'){S.region=t.value;$('#svcs').innerHTML=svcRows();var p=document.querySelector('.top .pill');if(p)p.textContent=R[S.region]}
  else if(t.id==='bsvc'||t.id==='breg'){S.boostSvc=$('#bsvc').value;S.boostReg=$('#breg').value;render()}
  else if(t.closest&&t.closest('#join')&&t.type==='checkbox'){$('#cost').innerHTML=cost()}
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='join')return;ev.preventDefault();
  var nom=$('#j-nom').value.trim(),regs=[].map.call(document.querySelectorAll('#regs-j input:checked'),function(i){return i.value}),svs=[].map.call(document.querySelectorAll('#svcs-j input:checked'),function(i){return i.value}),e={};
  if(!nom)e.nom='Indiquez le nom de votre entreprise.';
  if(!regs.length)e.reg='Choisissez au moins un secteur.';
  if(!svs.length)e.svc='Choisissez au moins un service.';
  if(Object.keys(e).length){S.errors=e;render();var f=document.querySelector('.err');if(f)f.scrollIntoView({block:'center'});return}
  var id='n'+Date.now(),since=parseInt($('#j-since').value,10)||2026;
  DATA.push({id:id,name:nom,since:since,tag:$('#j-desc').value.trim()||'Nouvelle entreprise inscrite au pilote.',hist:'',svs:svs,regs:regs,bid:0,tel:$('#j-tel').value.trim()||'819-555-0199',web:$('#j-web').value.trim().replace(/^https?:\/\//,''),active:true});
  S.me=id;S.done=true;S.errors=null;S.boostSvc=null;S.boostReg=null;go();
});
function fromHash(){var h=(location.hash||'').replace('#','');if(h==='entreprise'||h==='trouver'){S.tab=h;render()}}
window.addEventListener('hashchange',fromHash);
fromHash();render();
})();
</script>

</body>
</html>
