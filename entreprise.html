<html lang="fr">

<style>
:root{--bg:#fff;--fg:#0E1420;--muted:#5A6578;--accent:#0B3D91;--accent2:#1C5FD6;--on-accent:#fff;--surface:#F4F7FC;--line:#D8E0EE;--navy:#06214F;--good:#17724A;--good-bg:#E3F4EB;--warn:#9A5B00;--warn-bg:#FFF1D6;--bad:#B3261E;--bad-bg:#FDECEA;color-scheme:light;--fd:'Sora','Segoe UI',system-ui,sans-serif;--fb:'Figtree','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.02em;text-wrap:balance}

h2{font-size:clamp(26px,3.4vw,36px);line-height:1.15}
h3{font-size:18px;line-height:1.25}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .sm{font-size:14px} .xs{font-size:13px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2)}
.demo{background:var(--navy);color:#fff;font-size:13px;text-align:center;padding:7px 16px}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{background:none;border:0;padding:0;display:block;flex:none}
.logo{display:block;height:40px;width:auto}
.nav{display:flex;gap:4px;flex:1;margin-left:12px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);font-size:15px}

.tr{display:flex;gap:8px;margin-left:auto}
.tr .lg{display:inline} .tr .sh{display:none}

.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn.block{width:100%} .btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}

.sechead{display:flex;flex-direction:column;gap:12px;max-width:680px;margin-bottom:40px}

.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}

.strip div{display:flex;flex-direction:column}

.strip span{font-size:13px;color:var(--muted)}
.phonewrap{display:flex;justify-content:center}
.phone{width:290px;border:9px solid #0E1420;border-radius:40px;background:#fff;padding:18px 14px 22px;box-shadow:0 30px 60px -20px rgba(6,33,79,.35);transform:rotate(2deg)}

.ps{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--fg);margin-bottom:12px;background:#fff}

.pc b{display:block;font-size:14px}.pc span{color:var(--muted);font-size:12px}
.pc.sp{border-color:var(--accent);background:var(--surface)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#fff;border-radius:99px;padding:2px 8px;margin-bottom:4px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px;align-items:center}

.prose{display:flex;flex-direction:column;gap:16px;font-size:18px;color:#2A3446}
.checks2{display:flex;flex-direction:column;gap:12px}

.band{background:var(--navy);color:#fff;padding:84px 0}

.band .eyebrow{color:#8FB4FF}

.stats3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:44px}

.stats3 b{display:block;font-family:var(--fd);font-size:38px;letter-spacing:-.03em}
.stats3 span{font-size:15px;color:#C8D7F3}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.feat{transition:transform .2s,box-shadow .2s}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;counter-reset:s}
.step{position:relative;padding:24px;border-radius:16px;background:#fff;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:8px}
.step .num{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-weight:700}
.step p{color:var(--muted);font-size:15px}
.price{align-items:flex-start}
.price .amt{font-family:var(--fd);font-size:36px;letter-spacing:-.03em;line-height:1.1}
.price .amt small{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0}
.price.hot{border-color:var(--accent);box-shadow:0 14px 34px -16px rgba(11,61,145,.45);position:relative}
.price.hot::before{content:"Le plus courant";position:absolute;top:-12px;left:20px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:99px}
.example{margin-top:24px;padding:20px 24px;border-radius:16px;background:#fff;border:1.5px dashed var(--accent);font-size:16px}
details.faq{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 20px}
details.faq summary{cursor:pointer;font-weight:700;padding:18px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--accent)}

details.faq p{padding:0 0 18px;color:var(--muted)}
.faqs{display:flex;flex-direction:column;gap:10px;max-width:820px}
.cta{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:24px;padding:48px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.cta h2{color:#fff;max-width:22ch}

footer.ft{border-top:1px solid var(--line);padding:36px 0 48px;background:#fff}
footer.ft .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start}
footer.ft .links{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:14px}
footer.ft .links a,footer.ft .links button{color:var(--accent);font-weight:600;background:none;border:0;padding:0;text-decoration:none}
.page{padding:44px 0 80px;min-height:60vh}
.pagehead{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.pagehead p{color:var(--muted);font-size:17px}
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:920px){.formgrid{grid-template-columns:1fr}}
.sum{position:sticky;top:88px}
@media (max-width:920px){.sum{position:static}}
.stepper{list-style:none;margin:0 0 24px;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);padding:6px 14px 6px 6px;border-radius:99px;background:var(--surface)}
.stepper li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--fg);font-size:13px}
.stepper li.on{color:var(--accent);outline:2px solid var(--accent)}
.stepper li.on span,.stepper li.done span{background:var(--accent);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:14px;font-weight:700}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{border-color:var(--accent2);outline:3px solid rgba(28,95,214,.18)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.rowb{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.cat{border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.cathead{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:0;padding:14px 16px;text-align:left;font-weight:700;font-family:var(--fd);font-size:15px}
.cathead .n{margin-left:auto;font-family:var(--fb);font-weight:600;font-size:13px;color:var(--muted)}
.cathead .ch{color:var(--accent);transition:transform .15s;font-size:20px;line-height:1}
.cathead[aria-expanded=true] .ch{transform:rotate(90deg)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;padding:12px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;min-width:0}
.checks label:has(input:checked){border-color:var(--accent);background:var(--surface)}
.checks input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}
.checks b{display:block;font-size:14px}.checks small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.regs label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;min-height:46px}
.regs label:has(input:checked){border-color:var(--accent);background:var(--surface)}
.regs input{accent-color:var(--accent);width:18px;height:18px}
.bill{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.bill td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.bill td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.bill tr.total td{border-bottom:0;font-weight:700;font-size:18px;color:var(--accent)}
.note{font-size:14px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--good-bg);color:var(--good)} .note.info{background:var(--surface);color:var(--accent)} .note.bad{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.auth{max-width:460px;margin:0 auto}
.pwrow{position:relative}.pwrow button{position:absolute;right:6px;top:6px;min-height:36px;background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:0 10px}
.pwrow input{padding-right:84px}
.cred{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--surface);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;word-break:break-all}
.space{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;padding:32px 0 80px}
@media (max-width:860px){.space{grid-template-columns:1fr;gap:18px}}
.side{position:sticky;top:92px;align-self:start;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}}
.side button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:11px 14px;font-weight:600;color:var(--muted);text-align:left;white-space:nowrap}

.main{display:flex;flex-direction:column;gap:22px;min-width:0}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.mh h2{font-size:clamp(24px,3vw,30px)}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 16px;font-weight:700;color:var(--muted);min-height:36px}
.seg button[aria-selected=true]{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--fd);font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:13px;font-weight:700}.up{color:var(--good)}.down{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:3px;height:160px;padding-top:8px}
.bars div{flex:1;background:var(--accent2);border-radius:4px 4px 0 0;min-height:3px;opacity:.82}
.bars div:hover,.bars div:last-child{opacity:1;background:var(--accent)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr[data-act]{cursor:pointer}.tbl tr[data-act]:hover td{background:var(--surface)}
.tbl tr.me td{background:#EAF1FD}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media (max-width:700px){.filters{grid-template-columns:1fr}}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--surface);font-size:15px}
.rank div b{width:26px;color:var(--muted)}
.rank div.me{background:var(--accent);color:#fff;font-weight:700}.rank div.me b{color:#fff}
.scrim{position:fixed;inset:0;background:rgba(6,33,79,.5);z-index:55}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:60;padding:28px;overflow:auto;box-shadow:-20px 0 50px rgba(6,33,79,.25);display:flex;flex-direction:column;gap:16px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:90vh;overflow:auto;background:#fff;z-index:60;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 70px rgba(6,33,79,.4)}
.x{align-self:flex-end;background:var(--surface);border:0;border-radius:50%;width:36px;height:36px;font-size:20px;line-height:1;color:var(--muted)}
.kv{display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:80;max-width:92%}
.pay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;max-width:900px;margin:0 auto}
@media (max-width:760px){.pay{grid-template-columns:1fr}}
.pay>div{padding:32px;display:flex;flex-direction:column;gap:14px}
.pay>div:first-child{background:var(--surface)}
.big{font-family:var(--fd);font-size:34px;letter-spacing:-.03em}
.ok{width:64px;height:64px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center}
@media (prefers-reduced-motion:no-preference){.page>*,.main>*{animation:in .3s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
.pc .tag{color:#fff;font-size:10px;margin-bottom:4px}
</style>
</head>

var $=function(s){return document.querySelector(s)};

function money(n){return new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD'}).format(n)}

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function co(id){return DATA.filter(function(c){return c.id===id})[0]}

function nextBill(){var d=new Date();d.setDate(d.getDate()+30);return fmtDate(d)}
function monthly(n){return PRICE.mensuel+PRICE.service*Math.max(0,n-1)}

function copy(t){var ok=function(){toast('Copié dans le presse-papiers')};try{navigator.clipboard.writeText(t).then(ok,fallback)}catch(e){fallback()}function fallback(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Copie impossible : sélectionnez le texte')}a.remove()}}

function fb(s){var h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return 'f'+h.toString(16)}
function sha(s){try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(d){return Array.prototype.map.call(new Uint8Array(d),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}catch(e){return Promise.resolve(fb(s))}}
function findAcc(u){u=String(u||'').trim().toLowerCase();return ACC.filter(function(a){return a.user===u})[0]}
function login(u,p){var a=findAcc(u);if(!a)return Promise.resolve(null);if(a.demo)return Promise.resolve(p==='kliq2026'?a:null);return sha(a.salt+p).then(function(h){return h===a.hash?a:null})}

function rng(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}var a=h>>>0;return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function series(c,days){var r=rng(c.id),base=22+Math.floor(r()*20)+c.svs.length*7,a=[];for(var i=0;i<days*2;i++){a.push(Math.round(base*(1+.35*Math.sin(i/3.2))+i*.35+r()*14+(c.bid>0?base*.25:0)))}return {prev:a.slice(0,days),cur:a.slice(days)}}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function totals(app){var f=Math.round(app*.26),c=Math.round(f*.42),p=Math.round(c*.6);return {app:app,fiches:f,contacts:c,appels:p,site:c-p}}
function delta(a,b){if(!b)return '';var d=Math.round((a-b)/b*100);return '<em class="'+(d>=0?'up':'down')+'">'+(d>=0?'+':'')+d+' % vs période précédente</em>'}

function calc(n,first){var L=[];if(first)L.push(['Frais d’inscription (une seule fois)',PRICE.inscription]);L.push(['Abonnement mensuel, 1 service inclus',PRICE.mensuel]);if(n>1)L.push([(n-1)+' service'+(n>2?'s':'')+' additionnel'+(n>2?'s':'')+' × '+money(PRICE.service),PRICE.service*(n-1)]);return {lines:L,total:L.reduce(function(t,l){return t+l[1]},0)}}
function costTable(n,first,extra){if(n<1)return '<p class="muted sm">Choisissez au moins un service pour voir le coût.</p>';var c=calc(n,first),rows=c.lines.slice(),t=c.total;if(extra){rows.push(extra);t+=extra[1]}return '<table class="bill">'+rows.map(function(l){return '<tr><td>'+l[0]+'</td><td>'+money(l[1])+'</td></tr>'}).join('')+'<tr class="total"><td>'+(first?'Total de la première facture':'Total mensuel')+'</td><td>'+money(t)+'</td></tr></table><p class="muted xs">Avant taxes (TPS et TVQ).'+(first?' Ensuite '+money(monthly(n)+(extra?extra[1]:0))+' par mois.':'')+'</p>'}

  else if(f==='login'){var lu=$('#lu').value,lp=$('#lp').value;login(lu,lp).then(function(a){if(a){S.session=a;ls('kliq_sess',a.user);S.page='space';S.tab='dash';S.lerr='';S.lu='';go()}else{S.lerr='Nom d’utilisateur ou mot de passe incorrect.';S.lu=lu;render()}})}
  else if(f==='pw'){var a=S.session;if(a.demo)return toast('Le compte de démonstration ne peut pas être modifié.');if((S.np1||'').length<8||!/\d/.test(S.np1))return toast('8 caractères minimum, dont au moins un chiffre.');if(S.np1!==S.np2)return toast('Les mots de passe ne correspondent pas.');var salt=Math.random().toString(36).slice(2);sha(salt+S.np1).then(function(h){a.salt=salt;a.hash=h;saveAcc();S.np1=S.np2='';toast('Mot de passe mis à jour');render()})}});
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-act]');if(!b)return;var a=b.dataset.act,v=b.dataset.v,c=myCo();
  if(a==='site'){S.page='site';go()}
  else if(a==='go'){if(S.page!=='site'){S.page='site';render()}var el=document.getElementById(v);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='join'){S.page='join';if(S.page!=='join'||!S.step)S.step=1;go()}
  else if(a==='login'){S.page=S.session?'space':'login';S.lerr='';go()}

  else if(a==='pw'){S.showpw=!S.showpw;render()}

  else if(a==='back4'){S.page='join';S.step=4;go()}
  else if(a==='paid'){var F=S.form,u=F.user.trim().toLowerCase();if(findAcc(u)){toast('Ce nom d’utilisateur est déjà pris.');S.page='join';S.step=3;go();return}
    var salt=Math.random().toString(36).slice(2);sha(salt+F.pass).then(function(h){var id='u'+Date.now(),tot=calc(F.svs.length,true).total,n=F.svs.length,nc={id:id,name:F.nom.trim(),since:+F.since,tag:F.desc.trim(),svs:F.svs.slice(),regs:F.regs.slice(),bid:0,tel:F.tel.trim(),web:F.web.trim(),email:F.email.trim(),active:true,hist:'',inv:[[fmtDate(new Date()),'Inscription + abonnement'+(n>1?' + '+(n-1)+' service'+(n>2?'s':'')+' additionnel'+(n>2?'s':''):''),tot]]};DATA.push(nc);var ac={user:u,salt:salt,hash:h,cid:id};ACC.push(ac);saveAcc();S.session=ac;ls('kliq_sess',u);S.created={name:nc.name,user:u,pass:F.pass};S.page='welcome';go()})}
  else if(a==='copycred'){copy('Utilisateur : '+S.created.user+'\nMot de passe : '+S.created.pass)}
  else if(a==='copy'){copy(v)}
  else if(a==='tab'){S.tab=v;S.edit=null;S.drawer=null;go()}

  else if(a==='savefiche'){var E=S.edit;if(!E.svs.length||!E.regs.length){S.errors={edit:'Gardez au moins un service et un secteur.'};return render()}c.tag=E.tag.trim()||c.tag;c.tel=E.tel.trim()||c.tel;c.web=E.web.trim();c.email=E.email.trim();c.svs=E.svs.slice();c.regs=E.regs.slice();saveAcc();S.errors={};toast('Fiche mise à jour');render()}});
loadAcc();(function(){var su=ls('kliq_sess');if(su&&findAcc(su))S.session=findAcc(su)})();
render();

})();
